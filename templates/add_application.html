{% extends "base.html" %}

{% block title %}Add Job – Job Tracker{% endblock %}

{% block content %}

<div class="container">

    <div class="form-page-header">
        <h1>Add Job Application</h1>
        <p class="subtitle">Track a new application you've submitted.</p>
    </div>

    <div class="form-box">

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Company Name</label>
                    <input
                        type="text"
                        name="company"
                        placeholder="Google"
                        required>
                </div>


                <div class="form-group">
                    <label>Job Role</label>
                    <input
                        type="text"
                        name="role"
                        placeholder="Software Engineer"
                        required>
                </div>


                <div class="form-group">
                    <label>Location</label>
                    <input
                        type="text"
                        name="location"
                        placeholder="Bangalore">
                </div>


                <div class="form-group">
                    <label>Status</label>

                    <select name="status">
                        <option value="Applied">Applied</option>
                        <option value="Interview">Interview</option>
                        <option value="Rejected">Rejected</option>
                        <option value="Offer">Offer</option>
                    </select>

                </div>


                <div class="form-group">
                    <label>Applied Date</label>

                    <input
                        type="date"
                        name="applied_date"
                        required>

                </div>


                <div class="form-group">
                    <label>Job URL</label>

                    <input
                        type="url"
                        name="job_url"
                        placeholder="https://company.com/job">

                </div>

            </div>


            <div class="form-group full">

                <label>Notes</label>

                <textarea
                    name="notes"
                    placeholder="Any notes..."></textarea>

            </div>



            <div class="form-actions">

                <button class="btn" type="submit">
                    Save Application
                </button>


                <a href="{{ url_for('applications.dashboard') }}" 
                   class="btn btn-secondary">
                    Cancel
                </a>

            </div>


        </form>

    </div>

</div>

{% endblock %}
