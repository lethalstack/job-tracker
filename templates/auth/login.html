{% extends "base.html" %}

{% block title %}Log In – Job Tracker{% endblock %}

{% block content %}

<div class="container" style="max-width: 440px;">

    <span class="eyebrow">Welcome back</span>
    <h1 style="font-size: 32px;">Log In</h1>
    <p class="subtitle">Log in to see your job applications.</p>

    <div class="form-box" style="padding: 28px;">

        <form method="POST">

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="yourusername"
                required
                autofocus>

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="••••••••"
                required>

            <button class="btn" type="submit" style="width: 100%; margin-top: 6px;">
                Log In
            </button>

        </form>

    </div>

    <p class="subtitle" style="margin-top: 20px; margin-bottom: 0; text-align: center;">
        Don't have an account?
        <a href="{{ url_for('auth.register') }}" style="color: var(--primary); font-weight: 600;">
            Register
        </a>
    </p>

</div>

{% endblock %}
